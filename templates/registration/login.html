<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
                    <h2 class="fw-bold mt-2">Gestión Académica</h2>
                    <p class="text-muted">Sistema de Gestión Escolar</p>
                </div>
                <div class="card login-card p-4">
                    <h5 class="text-center mb-4">Iniciar Sesión</h5>
                    <form method="post">
                        {% csrf_token %}
                        {% if form.errors %}
                            <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                        {% endif %}
                        <div class="mb-3">
                            <label class="form-label">{{ form.username.label }}</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{ form.password.label }}</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
                <p class="text-center text-muted mt-3 small">Usuarios de prueba: admin / profesor1 / alumno1 — contraseña: password123</p>
            </div>
        </div>
    </div>
</body>
</html>
